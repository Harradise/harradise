<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doprava na letiště</title>

  <style>

    body {
      margin: 0;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .wrapper {
      max-width: 700px;
      margin: auto;
      padding: 12px;
    }

    .letak {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      display: block;
    }

    .wa-button {
      display: block;
      margin-top: 18px;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 16px;
      transition: 0.2s;
    }

    .wa-button:hover {
      transform: scale(1.02);
    }

  </style>
</head>

<body>

  <div class="wrapper">

    <img src="doprava-letiste.webp" alt="Doprava na letiště" class="letak">

    <a
      class="wa-button"
      href="https://wa.me/420730175315"
      target="_blank"
    >
      Napsat na WhatsApp
    </a>

  </div>

</body>
</html>
